[project]
name = "qa-devops"
version = "1.0.0"
description = "Simple Web App for Completing the Software Engineering and DevOps Assignment with QA"
requires-python = ">=3.13"
dependencies = [
    "bcrypt",
    "flask",
    "flask-limiter",
    "flask-login",
    "flask-wtf",
    "gunicorn",
    "psycopg2-binary",
    "python-dotenv",
    "retrying"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tst"]
