{% extends "base.html" %}

{% block content %}
<h1>Create Channel</h1>
<form method="POST" action="{{ url_for('create_channel') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="channel_name">Channel Name</label>
  <input type="text" id="channel_name" name="channel_name" maxlength="100" value="{{ channel_name or '' }}" required>

  <label for="channel_price">Monthly Price</label>
  <input type="number" id="channel_price" name="channel_price" min="0"
         step="0.01" maxlength="20" value="{{ channel_price or '' }}" required>

  {% if error %}
    <p class="form-error">{{ error }}</p>
  {% endif %}

  <button type="submit" class="create-btn">Create Channel</button>
</form>
{% endblock %}
